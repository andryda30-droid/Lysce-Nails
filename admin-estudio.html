<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lysce Nails — Administración</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF4EF;
    --blush:#F1D9DD;
    --rose:#B0455F;
    --rose-dark:#7C2E42;
    --ink:#2B2320;
    --gold:#B98A3E;
    --line:#E4D2CC;
    --ok:#4C7A5E;
    --bad:#B0455F;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Manrope',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ font-family:'Fraunces',serif; font-weight:600; margin:0; }
  header{
    padding:28px 20px 22px;
    background:linear-gradient(180deg,var(--blush) 0%, var(--cream) 100%);
    border-bottom:1px solid var(--line);
  }
  header h1{ font-size:26px; color:var(--rose-dark); letter-spacing:.2px;}
  header p{ margin:4px 0 0; color:#8a6f6a; font-size:14px;}
  nav{
    display:flex; gap:6px; padding:10px 16px 0; max-width:760px; margin:0 auto;
    overflow-x:auto;
  }
  nav button{
    border:none; background:transparent; padding:10px 14px; font-family:'Manrope';
    font-size:14.5px; font-weight:600; color:#9a827d; border-radius:10px 10px 0 0;
    cursor:pointer; white-space:nowrap; border-bottom:2px solid transparent;
  }
  nav button.active{ color:var(--rose-dark); border-bottom:2px solid var(--rose); }
  main{ max-width:760px; margin:0 auto; padding:20px 16px 60px; }
  .view{ display:none; } .view.active{ display:block; }

  .grid-stats{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:18px;}
  .stat{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
  .stat .label{ font-size:12.5px; color:#9a827d; font-weight:600; text-transform:none;}
  .stat .value{ font-family:'Fraunces',serif; font-size:24px; margin-top:4px; }
  .stat.balance .value{ color:var(--rose-dark); }
  .stat.ok .value{ color:var(--ok); }
  .stat.bad .value{ color:var(--bad); }

  .section-title{ font-size:17px; margin:22px 0 10px; color:var(--rose-dark); }

  .worker-row{ display:flex; justify-content:space-between; align-items:center; background:var(--card); border:1px solid var(--line); padding:12px 14px; border-radius:12px; margin-bottom:8px;}
  .worker-row .name{ font-weight:600; font-size:14.5px;}
  .worker-row .amt{ font-family:'Fraunces',serif; font-size:17px; color:var(--rose-dark);}
  .bar-bg{ height:6px; background:var(--blush); border-radius:4px; margin-top:6px; overflow:hidden;}
  .bar-fill{ height:100%; background:var(--rose); }

  form{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:20px;}
  form h3{ font-size:16px; margin-bottom:12px; color:var(--rose-dark);}
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:12.5px; font-weight:600; color:#8a6f6a; margin-bottom:5px;}
  .field input, .field select{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px;
    font-family:'Manrope'; font-size:14.5px; background:#fffdfb; color:var(--ink);
  }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  button.primary{
    width:100%; padding:12px; border:none; border-radius:10px; background:var(--rose);
    color:#fff; font-family:'Manrope'; font-weight:700; font-size:14.5px; cursor:pointer;
    margin-top:4px;
  }
  button.primary:active{ background:var(--rose-dark); }

  .list-item{
    display:flex; justify-content:space-between; align-items:flex-start;
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:12px 14px; margin-bottom:8px;
  }
  .list-item .left .title{ font-weight:700; font-size:14.5px;}
  .list-item .left .sub{ font-size:12.5px; color:#9a827d; margin-top:2px;}
  .list-item .right{ text-align:right; }
  .list-item .right .amt{ font-family:'Fraunces',serif; font-size:16px;}
  .amt.income{ color:var(--ok); }
  .amt.expense{ color:var(--bad); }
  .del{ background:none; border:none; color:#c79a94; font-size:12px; cursor:pointer; margin-top:4px; }

  .client-card{
    background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:8px;
  }
  .client-card .title{ font-weight:700; font-size:14.5px; }
  .client-card .sub{ font-size:12.5px; color:#9a827d; margin-top:2px; }
  .client-card .visits{ margin-top:6px; font-size:12.5px; color:var(--rose-dark); font-weight:600;}

  .empty{ text-align:center; padding:30px 10px; color:#a98f89; font-size:14px; }
  .loading{ text-align:center; padding:40px; color:#a98f89; }
</style>
</head>
<body>

<header>
  <h1>Lysce Nails</h1>
  <p>Administración de ingresos, egresos y clientes</p>
</header>

<nav>
  <button class="tab-btn active" data-view="resumen">Resumen</button>
  <button class="tab-btn" data-view="ingresos">Ingresos</button>
  <button class="tab-btn" data-view="egresos">Egresos</button>
  <button class="tab-btn" data-view="clientes">Clientes</button>
</nav>

<main id="main">
  <div class="loading">Cargando…</div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.10/dayjs.min.js"></script>
<script>
const WORKERS = ["Yo", "Trabajadora 1", "Trabajadora 2"];
let movimientos = []; // {id, type:'ingreso'|'egreso', fecha, monto, trabajadora, servicio, cliente, categoria, descripcion}
let clientes = [];    // {id, nombre, telefono, notas}
let ready = false;

async function loadData(){
  try{
    const m = await window.storage.get('movimientos', false);
    movimientos = m ? JSON.parse(m.value) : [];
  }catch(e){ movimientos = []; }
  try{
    const c = await window.storage.get('clientes', false);
    clientes = c ? JSON.parse(c.value) : [];
  }catch(e){ clientes = []; }
  ready = true;
  render();
}

async function saveMovimientos(){
  await window.storage.set('movimientos', JSON.stringify(movimientos), false);
}
async function saveClientes(){
  await window.storage.set('clientes', JSON.stringify(clientes), false);
}

function fmt(n){ return '$' + Number(n).toFixed(2); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

let currentView = 'resumen';

function switchView(v){
  currentView = v;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.view===v));
  render();
}
document.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click', ()=>switchView(b.dataset.view)));

function render(){
  const main = document.getElementById('main');
  if(!ready){ main.innerHTML = '<div class="loading">Cargando…</div>'; return; }
  if(currentView==='resumen') return renderResumen(main);
  if(currentView==='ingresos') return renderIngresos(main);
  if(currentView==='egresos') return renderEgresos(main);
  if(currentView==='clientes') return renderClientes(main);
}

function renderResumen(main){
  const totalIn = movimientos.filter(m=>m.type==='ingreso').reduce((s,m)=>s+m.monto,0);
  const totalOut = movimientos.filter(m=>m.type==='egreso').reduce((s,m)=>s+m.monto,0);
  const balance = totalIn - totalOut;

  const porTrabajadora = WORKERS.map(w=>({
    nombre:w,
    total: movimientos.filter(m=>m.type==='ingreso' && m.trabajadora===w).reduce((s,m)=>s+m.monto,0)
  }));
  const maxW = Math.max(1, ...porTrabajadora.map(w=>w.total));

  main.innerHTML = `
    <div class="grid-stats">
      <div class="stat ok"><div class="label">Ingresos totales</div><div class="value">${fmt(totalIn)}</div></div>
      <div class="stat bad"><div class="label">Egresos totales</div><div class="value">${fmt(totalOut)}</div></div>
      <div class="stat balance" style="grid-column:1/3;"><div class="label">Balance neto</div><div class="value">${fmt(balance)}</div></div>
    </div>
    <div class="section-title">Ingresos por trabajadora</div>
    ${porTrabajadora.map(w=>`
      <div class="worker-row">
        <div>
          <div class="name">${w.nombre}</div>
          <div class="bar-bg" style="width:160px;"><div class="bar-fill" style="width:${(w.total/maxW*100)||0}%"></div></div>
        </div>
        <div class="amt">${fmt(w.total)}</div>
      </div>`).join('')}
    <div class="section-title">Movimientos recientes</div>
    ${movimientos.length===0 ? '<div class="empty">Aún no hay movimientos registrados</div>' :
      movimientos.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha)).slice(0,6).map(m=>`
      <div class="list-item">
        <div class="left">
          <div class="title">${m.type==='ingreso' ? (m.servicio||'Servicio') : (m.categoria||'Egreso')}</div>
          <div class="sub">${m.fecha}${m.type==='ingreso' && m.trabajadora ? ' · '+m.trabajadora : ''}</div>
        </div>
        <div class="right"><div class="amt ${m.type==='ingreso'?'income':'expense'}">${m.type==='ingreso'?'+':'-'}${fmt(m.monto)}</div></div>
      </div>`).join('')}
  `;
}

function renderIngresos(main){
  main.innerHTML = `
    <form id="formIngreso">
      <h3>Registrar ingreso</h3>
      <div class="field"><label>Fecha</label><input type="date" name="fecha" required></div>
      <div class="row2">
        <div class="field"><label>Servicio</label><input type="text" name="servicio" placeholder="Ej. Manicure" required></div>
        <div class="field"><label>Monto</label><input type="number" step="0.01" name="monto" placeholder="0.00" required></div>
      </div>
      <div class="row2">
        <div class="field"><label>Trabajadora</label>
          <select name="trabajadora">${WORKERS.map(w=>`<option>${w}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Cliente (opcional)</label><input type="text" name="cliente" placeholder="Nombre"></div>
      </div>
      <button class="primary" type="submit">Guardar ingreso</button>
    </form>
    <div class="section-title">Historial de ingresos</div>
    <div id="listaIngresos"></div>
  `;
  const ingresos = movimientos.filter(m=>m.type==='ingreso').sort((a,b)=>b.fecha.localeCompare(a.fecha));
  document.getElementById('listaIngresos').innerHTML = ingresos.length===0 ? '<div class="empty">Sin ingresos aún</div>' :
    ingresos.map(m=>`
      <div class="list-item">
        <div class="left">
          <div class="title">${m.servicio}</div>
          <div class="sub">${m.fecha} · ${m.trabajadora}${m.cliente?' · '+m.cliente:''}</div>
          <button class="del" data-id="${m.id}">Eliminar</button>
        </div>
        <div class="right"><div class="amt income">+${fmt(m.monto)}</div></div>
      </div>`).join('');

  document.getElementById('formIngreso').addEventListener('submit', async e=>{
    e.preventDefault();
    const f = new FormData(e.target);
    movimientos.push({
      id: uid(), type:'ingreso',
      fecha: f.get('fecha'), servicio: f.get('servicio'),
      monto: parseFloat(f.get('monto')), trabajadora: f.get('trabajadora'),
      cliente: f.get('cliente')||''
    });
    await saveMovimientos();
    e.target.reset();
    render();
  });
  document.querySelectorAll('#listaIngresos .del').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      movimientos = movimientos.filter(m=>m.id!==btn.dataset.id);
      await saveMovimientos();
      render();
    });
  });
}

function renderEgresos(main){
  main.innerHTML = `
    <form id="formEgreso">
      <h3>Registrar egreso</h3>
      <div class="field"><label>Fecha</label><input type="date" name="fecha" required></div>
      <div class="row2">
        <div class="field"><label>Categoría</label>
          <select name="categoria">
            <option>Alquiler</option><option>Insumos</option><option>Servicios (luz/agua/internet)</option>
            <option>Marketing</option><option>Otro</option>
          </select>
        </div>
        <div class="field"><label>Monto</label><input type="number" step="0.01" name="monto" placeholder="0.00" required></div>
      </div>
      <div class="field"><label>Descripción (opcional)</label><input type="text" name="descripcion" placeholder="Detalle"></div>
      <button class="primary" type="submit">Guardar egreso</button>
    </form>
    <div class="section-title">Historial de egresos</div>
    <div id="listaEgresos"></div>
  `;
  const egresos = movimientos.filter(m=>m.type==='egreso').sort((a,b)=>b.fecha.localeCompare(a.fecha));
  document.getElementById('listaEgresos').innerHTML = egresos.length===0 ? '<div class="empty">Sin egresos aún</div>' :
    egresos.map(m=>`
      <div class="list-item">
        <div class="left">
          <div class="title">${m.categoria}</div>
          <div class="sub">${m.fecha}${m.descripcion?' · '+m.descripcion:''}</div>
          <button class="del" data-id="${m.id}">Eliminar</button>
        </div>
        <div class="right"><div class="amt expense">-${fmt(m.monto)}</div></div>
      </div>`).join('');

  document.getElementById('formEgreso').addEventListener('submit', async e=>{
    e.preventDefault();
    const f = new FormData(e.target);
    movimientos.push({
      id: uid(), type:'egreso',
      fecha: f.get('fecha'), categoria: f.get('categoria'),
      monto: parseFloat(f.get('monto')), descripcion: f.get('descripcion')||''
    });
    await saveMovimientos();
    e.target.reset();
    render();
  });
  document.querySelectorAll('#listaEgresos .del').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      movimientos = movimientos.filter(m=>m.id!==btn.dataset.id);
      await saveMovimientos();
      render();
    });
  });
}

function renderClientes(main){
  main.innerHTML = `
    <form id="formCliente">
      <h3>Nueva clienta</h3>
      <div class="row2">
        <div class="field"><label>Nombre</label><input type="text" name="nombre" required></div>
        <div class="field"><label>Teléfono</label><input type="text" name="telefono" placeholder="0412-0000000"></div>
      </div>
      <div class="field"><label>Notas (preferencias, alergias, etc.)</label><input type="text" name="notas"></div>
      <button class="primary" type="submit">Guardar clienta</button>
    </form>
    <div class="section-title">Clientas registradas</div>
    <div id="listaClientes"></div>
  `;
  document.getElementById('listaClientes').innerHTML = clientes.length===0 ? '<div class="empty">Aún no has registrado clientas</div>' :
    clientes.map(c=>{
      const visitas = movimientos.filter(m=>m.type==='ingreso' && m.cliente && m.cliente.toLowerCase()===c.nombre.toLowerCase()).length;
      return `
      <div class="client-card">
        <div class="title">${c.nombre}</div>
        <div class="sub">${c.telefono||'Sin teléfono'}${c.notas?' · '+c.notas:''}</div>
        <div class="visits">${visitas} visita${visitas!==1?'s':''} registrada${visitas!==1?'s':''}</div>
        <button class="del" data-id="${c.id}">Eliminar</button>
      </div>`;
    }).join('');

  document.getElementById('formCliente').addEventListener('submit', async e=>{
    e.preventDefault();
    const f = new FormData(e.target);
    clientes.push({ id: uid(), nombre: f.get('nombre'), telefono: f.get('telefono')||'', notas: f.get('notas')||'' });
    await saveClientes();
    e.target.reset();
    render();
  });
  document.querySelectorAll('#listaClientes .del').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      clientes = clientes.filter(c=>c.id!==btn.dataset.id);
      await saveClientes();
      render();
    });
  });
}

loadData();
</script>
</body>
</html>
